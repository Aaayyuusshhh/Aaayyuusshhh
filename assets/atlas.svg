<svg xmlns="http://www.w3.org/2000/svg" width="620" height="330" viewBox="0 0 620 330">
<style>text{font-family:'Inter','SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif}.m{font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace}.glow{animation:gl 3.5s ease-in-out infinite}@keyframes gl{0%,100%{stroke-opacity:.15}50%{stroke-opacity:.9}}.s{animation:up .8s cubic-bezier(.2,.8,.2,1) both}@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}</style>
<defs>
<linearGradient id="au" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#f5b544"/></linearGradient>
<linearGradient id="au2" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
<radialGradient id="g1" cx=".15" cy=".1" r=".7"><stop offset="0" stop-color="#22d3ee" stop-opacity=".22"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx=".9" cy=".95" r=".7"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".25"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
<pattern id="dt" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity=".05"/></pattern>
<linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#f5b544"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs>
<clipPath id="c"><rect width="620" height="330" rx="20"/></clipPath>
<g clip-path="url(#c)"><rect width="620" height="330" fill="#06070d"/><rect width="620" height="330" fill="url(#dt)"/>
<rect width="620" height="330" fill="url(#g1)"/><rect width="620" height="330" fill="url(#g2)"/><rect x="0" y="0" width="620" height="4" fill="url(#bar)"/>
<text x="36" y="58" font-size="12.5" font-weight="800" letter-spacing="4" fill="#f5b544">FLAGSHIP · AGENTIC CREDIT SAAS</text>
<text x="34" y="112" font-size="50" font-weight="900" letter-spacing="3" fill="url(#bar)">ATLAS</text>
<text x="36" y="146" font-size="17" font-weight="700" fill="#eef1fb">One CIN in. A bank-ready credit file out.</text><text x="36" y="180" font-size="14" fill="#8d95ad">Live SaaS behind resurgentindia.ai: CMA, board notes, forensic audits,</text><text x="36" y="204" font-size="14" fill="#8d95ad">valuations and AML reports, produced by verified AI agents.</text><g class="s" style="animation-delay:0.30s"><rect x="36" y="238" width="175" height="66" rx="12" fill="#0e1122" stroke="#1c2033"/>
<text x="52" y="268" font-size="22" font-weight="900" fill="#eef1fb">35</text>
<text x="52" y="290" font-size="11.5" fill="#8d95ad">report engines</text></g><g class="s" style="animation-delay:0.45s"><rect x="223" y="238" width="175" height="66" rx="12" fill="#0e1122" stroke="#1c2033"/>
<text x="239" y="268" font-size="22" font-weight="900" fill="#eef1fb">24</text>
<text x="239" y="290" font-size="11.5" fill="#8d95ad">bank templates</text></g><g class="s" style="animation-delay:0.60s"><rect x="409" y="238" width="175" height="66" rx="12" fill="#0e1122" stroke="#1c2033"/>
<text x="425" y="268" font-size="22" font-weight="900" fill="#eef1fb">Mins</text>
<text x="425" y="290" font-size="11.5" fill="#8d95ad">not weeks</text></g><rect x="1.5" y="1.5" width="617" height="327" rx="19" fill="none" stroke="url(#bar)" stroke-width="2" class="glow"/></g>
<rect x=".5" y=".5" width="619" height="329" rx="20" fill="none" stroke="#1c2033"/></svg>