<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250">
<style>text{font-family:'Inter','SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif}.m{font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace}.glow{animation:gl 3.5s ease-in-out infinite}@keyframes gl{0%,100%{stroke-opacity:.9}50%{stroke-opacity:.2}}</style>
<defs>
<linearGradient id="au" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c7d2fe"/></linearGradient><linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
<linearGradient id="au2" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
<radialGradient id="g1" cx=".1" cy="0" r=".8"><stop offset="0" stop-color="#38bdf8" stop-opacity=".14"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx=".95" cy="1" r=".8"><stop offset="0" stop-color="#818cf8" stop-opacity=".16"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></radialGradient>
<linearGradient id="sheen" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<pattern id="dt" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity=".05"/></pattern>
<linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#818cf8"/></linearGradient></defs>
<clipPath id="c"><rect width="900" height="250" rx="22"/></clipPath>
<g clip-path="url(#c)"><rect width="900" height="250" fill="#0b0f19"/><rect width="900" height="250" fill="url(#dt)"/>
<rect width="900" height="250" fill="url(#g1)"/><rect width="900" height="250" fill="url(#g2)"/><rect width="900" height="5" fill="url(#bar)"/>
<text x="44" y="58" font-size="16" font-weight="800" letter-spacing="4" fill="#38bdf8">FLAGSHIP · AML &amp; SANCTIONS INTELLIGENCE</text>
<text x="40" y="118" font-size="56" font-weight="900" letter-spacing="4" fill="url(#au)">ARGUS</text>
<text x="44" y="156" font-size="23" font-weight="700" fill="#f1f5f9">The hundred-eyed watchlist that never sleeps.</text><rect x="44" y="176" width="260" height="56" rx="12" fill="#0f1426" stroke="#1f2a3d"/>
<text x="62" y="212" font-size="25" font-weight="900" fill="#38bdf8">12.2M+</text>
<text x="165" y="211" font-size="17" fill="#a3adc2">records</text><rect x="320" y="176" width="260" height="56" rx="12" fill="#0f1426" stroke="#1f2a3d"/>
<text x="338" y="212" font-size="25" font-weight="900" fill="#38bdf8">800</text>
<text x="394" y="211" font-size="17" fill="#a3adc2">sources</text><rect x="596" y="176" width="260" height="56" rx="12" fill="#0f1426" stroke="#1f2a3d"/>
<text x="614" y="212" font-size="25" font-weight="900" fill="#38bdf8">~0.2s</text>
<text x="702" y="211" font-size="17" fill="#a3adc2">per screen</text><rect x="1.5" y="1.5" width="897" height="247" rx="21" fill="none" stroke="url(#bar)" stroke-width="2.5" class="glow"/><rect x="-260" y="-40" width="220" height="330" fill="url(#sheen)" transform="skewX(-18)"><animate attributeName="x" values="-300;1200" dur="6.5s" begin="-1s" repeatCount="indefinite"/></rect></g>
<rect x=".5" y=".5" width="899" height="249" rx="22" fill="none" stroke="#1f2a3d"/></svg>